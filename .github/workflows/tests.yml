name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Ubuntu 24.04 is the base of Linux Mint 22
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what the apps and the tests need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-xapp-1.0 \
            python3-xlib xdotool x11-utils \
            xvfb openbox dbus dbus-x11 at-spi2-core \
            gettext make adwaita-icon-theme librsvg2-common fonts-dejavu-core

      - name: Build the translations
        run: make

      - name: Run the tests
        run: tests/run-tests
